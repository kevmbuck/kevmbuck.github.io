- id: defocusing-nls-blowup
  title: "Blow-up for energy supercritical defocusing nonlinear Schrödinger equations in dimensions three, four and five"
  authors: ["Kevin Buck","Alvaro Carballeira","Javier Gómez-Serrano","Jia Shi"]
  year: 2026
  status: preprint
  venue: arXiv preprint
  topics: ["nonlinear PDEs","nonlinear Schrödinger equations","computer-assisted proofs"]
  abstract: >-
    We prove finite-time blow-up from smooth, radial, compactly supported initial data for energy-supercritical defocusing nonlinear Schrödinger equations in dimensions three, four, and five, using a computer-assisted shooting argument.
