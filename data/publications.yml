- id: magnetic-double-wells
  title: "Double-wells in a strong magnetic field: absence of tunneling for infinitely many values of the coupling constant"
  authors: ["Kevin Buck","Charles L. Fefferman","Javier Gómez-Serrano","Amaury Hayat","Jacob Shapiro","Michael I. Weinstein"]
  year: 2026
  status: preprint
  venue: arXiv preprint
  topics: [spectral theory, magnetic Schrödinger operators, asymptotic analysis]
  abstract: >-
    We prove the fixed-potential conjecture for inversion-symmetric magnetic double wells, constructing a single-well potential for which the two lowest eigenvalues cross exactly at infinitely many coupling values. The proof uses asymptotic analysis of the magnetic hopping coefficient.
  links:
    arxiv: https://arxiv.org/abs/2609.21078
