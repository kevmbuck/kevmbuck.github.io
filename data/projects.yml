- id: pinn-convergence
  title: Rigorous Foundations for Physics-Informed Neural Networks
  kind: research
  summary: Error estimates that connect PINN residual loss to approximation accuracy for nonlinear PDEs.
  description: >-
    This work treats a trained PINN as the solution of a perturbed PDE and uses well-posedness and continuity estimates to quantify when a small residual implies a small solution error.
  tags: [PINNs, PDE analysis, error estimates]
  publication_ids: [pinns-nsch]
  links:
