  featured: true
- id: aa-pinn
  title: Auto-Adaptive PINNs
  kind: research
  summary: Adaptive collocation strategies for multiscale and interface-dominated PDEs.
  description: >-
    The sampling distribution evolves alongside network training using problem-informed quantities, allowing collocation points to follow moving interfaces and other difficult regions.
  tags: [PINNs, adaptive sampling, phase transitions]
